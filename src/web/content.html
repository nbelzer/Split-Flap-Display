<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="data:," />
        <title x-text="header"></title>
        <style>
            [x-cloak] {
                display: none !important;
            }
        </style>
        <link rel="stylesheet" href="index.css" />
        <script defer src="index.js" type="module"></script>
    </head>
    <body
        x-data="page('Content')"
        class="flex flex-col items-center justify-center min-h-screen bg-gray-900 text-gray-100"
    >
        <div
            x-data="content"
            class="flex flex-col items-center justify-center bg-gray-800 p-6 m-6 rounded-lg shadow-lg max-w-md w-11/12 text-center"
        >
            <div class="flex items-center w-full mb-6">
                <a
                    href="index.html"
                    class="text-blue-400 hover:no-underline flex items-center"
                    >&lt;</a
                >
                <h1 class="text-2xl font-bold mx-auto" x-text="header"></h1>
            </div>

            <label for="contentUrl" class="block text-left text-lg w-full"
                >Plain-text URL</label
            >
            <input
                class="w-full p-3 mt-2 text-lg border border-gray-600 rounded-md bg-gray-700 text-gray-100"
                type="url"
                id="contentUrl"
                x-model="settings.contentUrl"
                placeholder="https://example.com/display.txt"
            />
            <p class="w-full mt-3 text-sm text-left text-gray-400">
                The display fetches this URL immediately and at the start of
                every minute. The response may contain up to one character per
                display module.
            </p>
            <div
                class="w-full p-3 mt-2 text-sm text-white bg-red-500 rounded-md"
                x-cloak
                x-show="errors.key === 'contentUrl'"
                x-text="errors.message"
            ></div>

            <button
                class="w-full p-3 mt-6 text-lg font-semibold text-white bg-blue-500 rounded-md hover:bg-blue-700 transition-colors"
                x-on:click.prevent="save()"
                :disabled="saving || loading.settings"
                :class="{'opacity-50 cursor-not-allowed': saving || loading.settings}"
            >
                Save URL
            </button>

            <div
                class="fixed top-4 left-1/2 transform -translate-x-1/2 p-4 text-white rounded-md transition duration-300"
                :class="{'bg-green-500': dialog.type === 'success', 'bg-red-500': dialog.type === 'error'}"
                x-show="dialog.show"
                x-text="dialog.message"
                x-cloak
            ></div>
        </div>
        <script>
            document.addEventListener("alpine:init", () => {
                Alpine.data("content", () => ({
                    saving: false,

                    save() {
                        const url = (this.settings.contentUrl || "").trim();
                        if (
                            url !== "" &&
                            !url.startsWith("http://") &&
                            !url.startsWith("https://")
                        ) {
                            return this.showDialog(
                                "URL must start with http:// or https://.",
                                "error",
                            );
                        }

                        this.saving = true;
                        this.errors = {};
                        fetch("/settings", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ contentUrl: url }),
                        })
                            .then(async (response) => {
                                const data = await response.json();
                                if (!response.ok) {
                                    throw data;
                                }
                                return data;
                            })
                            .then((data) =>
                                this.showDialog(data.message, data.type),
                            )
                            .catch((error) => {
                                this.errors = error.errors || {};
                                this.showDialog(
                                    error.message || "Failed to save URL.",
                                    "error",
                                );
                            })
                            .finally(() => (this.saving = false));
                    },
                }));
            });
        </script>
    </body>
</html>
